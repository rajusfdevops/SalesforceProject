<template>
    <lightning-card title="Recipe Explorer" icon-name="standard:apps">
        <div class="app-selector">
            <lightning-combobox
                name="appSelector"
                label="Select App"
                value={selectedApp}
                options={appOptions}
                onchange={handleAppChange}>
            </lightning-combobox>
        </div>

        <div class="app-container">
            <template if:true={isReactApp}>
                <iframe
                    src={iframeUrl}
                    style="width: 100%; height: 600px; border: none; border-radius: 4px;">
                </iframe>
            </template>
        </div>
    </lightning-card>
</template>
